name: CI

on:
  push:
    branches: [main]
  pull_request:

# The client half only. The Rust shell is not built here: it needs the Tauri
# Linux system libraries (webkit2gtk, libsecret and friends) and several minutes
# of compile time, and nothing currently gates on it. Add a job when it does.
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
