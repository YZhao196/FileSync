name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch at a time, newest wins. Without this, every push while an
# earlier run is still going starts a second full matrix against the same code —
# and the Android job takes long enough that a handful of pushes will queue five
# runs deep, each one building a commit nobody is waiting for any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The client half only. The Rust shell is not built here: it needs the Tauri
# Linux system libraries (webkit2gtk, libsecret and friends) and several minutes
# of compile time, and nothing currently gates on it. Add a job when it does.
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The version lives in three files and the installer, the build and
      # Settings → About each read a different one. Bumping two of the three
      # ships an app that confidently displays the wrong version.
      - name: Versions agree
        run: npm run check-versions

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # mobile/src holds copies of app/src's shared logic, not links — see
      # scripts/sync-core.mjs. Nothing about the two clients' own test suites
      # notices when they disagree about the API, so this is the only thing
      # that would.
      - name: Shared logic has not drifted
        working-directory: .
        run: node scripts/sync-core.mjs --check

  # The Rust shell, which used to be skipped here on the grounds that nothing
  # gated on it. It is built now because "it compiles" was a claim about exactly
  # one machine — this one, Windows — and the project ships three desktops.
  # Expect this to be the job that finds things; that is its purpose.
  desktop-shell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Tauri links against the system webview, and the keyring crate against
      # libsecret. Neither is present on a bare runner; without them the build
      # fails at link time rather than compile time, which reads as a code error
      # and is not one.
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev

      - run: npm ci

      - run: npm run build

      # `bundle.targets` is "all", so this produces nsis+msi on Windows, deb+rpm
      # +AppImage on Linux and app+dmg on macOS. The bundles are unsigned — see
      # app/README.md for what each platform warns about.
      - name: Build the shell and its bundles
        run: npx tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: filesynapse-${{ matrix.os }}
          path: app/src-tauri/target/release/bundle/
          if-no-files-found: warn

  # The infra scripts: the host agent, which is dependency-free Node and so needs
  # no install step — that being the point of it — and the provisioning script.
  # Syntax-checked as well as tested, because `node --check` catches an import of
  # a file that does not exist, and a broken COPY in the Dockerfile would
  # otherwise only surface on the server.
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check infra/agent/agent.mjs
          node --check infra/agent/decisions.mjs
          node --check infra/agent/captionStore.mjs
          node --check infra/agent/containers.mjs

      # provision.sh builds generated files inside double-quoted `bash -c`
      # strings, so a backtick in a *comment* is command substitution and runs.
      # One did, at provision time, before it was noticed — a comment about
      # pulling images would have pulled them.
      - name: provision.sh is safe to run
        run: |
          # The backtick rule covers both scripts, not just the one that needs
          # it today. It was added here after the same mistake was made three
          # times in one sitting — each time in a comment, each time invisible
          # while the change was being read back. A rule that depends on
          # remembering it is a rule that fails eventually.
          for script in infra/provision/provision.sh infra/provision/verify.sh; do
            bash -n "$script" || exit 1
            if grep -n '`' "$script"; then
              echo "::error::backticks in $script are command substitution in a double-quoted step body, even in comments"
              exit 1
            fi
          done
          python3 -m py_compile infra/agent/layla/server.py
          echo "infra scripts ok"

      - name: Test
        run: |
          node infra/agent/captionStore.test.mjs
          node infra/agent/containers.test.mjs

      # Runs provision.sh for real against a sandbox — its absolute paths
      # rewritten, every external command stubbed. The script itself executes:
      # heredocs, quoting, `set -e`, the `run` helper and the step sequencing
      # all run. What it cannot prove is that apt and docker do anything with
      # what it wrote, which is what provision-smoke.yml is for.
      - name: Provisioning dry run
        run: node infra/provision/provision.test.mjs

      # The compose files can only be checked where Docker exists, which is here
      # and not on the Windows dev machine. Without this a YAML slip or a bad
      # interpolation is discovered by the person running provisioning for the
      # first time, on the server, with no stack to fall back to.
      - name: Validate compose files
        run: |
          AGENT_TOKEN=ci docker compose -f infra/agent/docker-compose.yml config >/dev/null
          echo "agent compose ok"
          AGENT_TOKEN=ci docker compose -f infra/agent/docker-compose.yml --profile decisions config >/dev/null
          echo "agent compose with the decisions profile ok"

  # The mobile client. Its `src/core` and `src/lib` are *copies* of the desktop's
  # — see scripts/sync-core.mjs — so these tests are the desktop's own, run
  # against React Native. That is the point: the shared logic is verified on both
  # platforms by the same assertions rather than by two suites that drift apart.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # 22, not 20. Something in the Expo tree declares `node: ^22.13.0 || >=24`
      # and `npm ci` warns EBADENGINE against 20 on every run — a warning today
      # and an install failure the next time that range tightens.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # The token and icon modules are generated and committed, so they can go
      # stale in a way nothing else catches: edit `tokens.css` on the desktop and
      # the phone keeps rendering yesterday's palette, silently and correctly
      # looking. These are the checks that notice.
      - name: Generated files are current
        working-directory: .
        run: |
          node scripts/gen-mobile-tokens.mjs --check
          node scripts/gen-mobile-icons.mjs --check

      - run: npm run typecheck

      - run: npm test

  # The only phone artefact anything can produce without a Mac. A debug APK
  # installs on a physical device over `adb`, so this is a real deliverable
  # rather than a smoke test — though nothing here can prove it *runs*, which
  # needs a device and, ultimately, a server.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Same Node as the mobile job, for the same reason — it installs the same
      # dependency tree and hits the same EBADENGINE range.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # React Native 0.86 builds against the Android Gradle plugin's Java, not
      # whatever the runner happens to ship.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # `packages` is set explicitly because the action's default is
      # `tools platform-tools`, and the standalone `tools` package no longer
      # exists in Google's repository — so the default fails with
      # "Failed to find package 'tools'" before a single line is compiled.
      # Gradle installs the build-tools and platform it needs itself, once the
      # licenses above are accepted.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: npm ci

      # `--no-install` because npm already ran; prebuild only generates the
      # native project, which is deliberately not committed. See app.config /
      # app.json — CNG means `android/` is a build artefact.
      - run: npx expo prebuild -p android --no-install

      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: filesynapse-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
