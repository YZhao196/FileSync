[package]
name = "filesynapse"
version = "0.1.0"
description = "FileSynapse — server status, photos, and files"
edition = "2021"
rust-version = "1.77"

[lib]
name = "filesynapse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is the reason this is a desktop app rather than a web page: three
# numbers visible without opening the window (PLAN.md §11).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Needed for live mode: the webview enforces CORS, and Immich/Nextcloud do not
# send permissive headers. This plugin issues requests from Rust, which is not
# subject to CORS. See filesynapsetodo.md, step 5.
tauri-plugin-http = "2"
# Launch at login, and notifying when a backup fails.
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# A second launch focuses the running window instead of starting a second copy.
# Without it a tray app can be started repeatedly — several tray icons, several
# independent backup watchers polling the same server.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Response bodies cross the IPC boundary base64-encoded rather than as a
# `Vec<u8>`. Serde turns that into a JSON array of numbers — several bytes of
# text per byte of payload — which is fine for a status object and not fine for
# a photograph. A dependency rather than twenty hand-rolled lines: base64's
# alphabet and padding are exactly the sort of thing to get subtly wrong.
base64 = "0.22"
# HTTP client for CORS-bypass commands — routes requests from Rust, not the webview.
reqwest = { version = "0.12", features = ["json"] }
# OS keychain integration — Credential Manager on Windows, Keychain on macOS,
# Secret Service on Linux. Credentials never touch a plaintext file (PLAN.md §11).
# Without these features keyring 3 silently falls back to an in-memory mock store.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# ── Build profiles ────────────────────────────────────────────────────────
#
# Cargo's default dev profile compiles every dependency with **full** debug
# information. Through `tauri`, `reqwest` and the keyring stack that is roughly
# 500 crates, and it put 8.3 GB in `target/debug/deps` alone — five to ten times
# the code's own size, for twenty files of Rust that mostly wire up commands.
#
# `line-tables-only` keeps file and line numbers in a panic backtrace and drops
# everything else: the part that is actually read. Raise it back to `2`, or to
# `true`, if you ever need to inspect locals in a debugger — it costs a rebuild,
# not a change of behaviour.
[profile.dev]
debug = "line-tables-only"

# The shipped binary. Symbols were 16 MB of a 16.9 MB executable and nothing at
# the other end consumes them.
[profile.release]
strip = "symbols"
