# The host agent. Sits alongside the Immich and Nextcloud stacks and gives the
# desktop app the one thing they cannot: restic state, disk usage, container
# health and tailnet status.
#
#   cd infra/agent
#   cp .env.example .env      # then edit
#   docker compose up -d
#
# Reachable at http://<host>:8787 — over Tailscale only. Do not port-forward it.

services:
  agent:
    build: .
    restart: unless-stopped
    # Capped, like everything here. The agent holds base64 image bytes in memory
    # while captioning, so it is not a fixed cost — but 512 MB is far more than a
    # photo and its caption, and the point of the cap is that a leak degrades the
    # agent rather than the stack beside it.
    mem_limit: ${AGENT_MEMORY:-512m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The agent does nothing slow at startup, but the container is often
      # started moments after Docker itself.
      start_period: 10s
    ports:
      - "8787:8787"
    environment:
      AGENT_TOKEN: "${AGENT_TOKEN:?set AGENT_TOKEN in .env}"
      AGENT_PHOTOS_PATH: "/srv/photos"
      AGENT_CLOUD_PATH: "/srv/cloud"
      # `slug=container`, because neither stack's container names are guessable:
      # Immich's compose sets `immich_server` and `immich_postgres`, ours sets
      # `nextcloud` and `nextcloud-db`. See containers.mjs.
      AGENT_SERVICES: "${AGENT_SERVICES:-immich=immich_server,nextcloud=nextcloud,mariadb=nextcloud-db,postgres=immich_postgres}"
      RESTIC_REPOSITORY: "b2:filesynapse-backup:/"
      AGENT_BACKUP_STATUS: "/var/lib/filesynapse/last-backup"
      # For `restic snapshots` to work, the agent also needs B2_ACCOUNT_ID,
      # B2_ACCOUNT_KEY and RESTIC_PASSWORD. infra/provision/provision.sh writes
      # exactly those to /etc/filesynapse/backup.env on the host; copy the three
      # values into this service's .env (or add `env_file:` pointing at it) and
      # the tile stops saying "unknown".

      # ── Optional decision pipeline ──────────────────────────────────────────
      # Unset these and the four /api/decisions routes report "unavailable"
      # without contacting anything. Off by default: Immich's own ML container
      # already does semantic search, so this is an opt-in, not a base feature.
      AGENT_OLLAMA_URL: "${AGENT_OLLAMA_URL:-http://ollama:11434}"
      AGENT_LAYLA_URL: "${AGENT_LAYLA_URL:-http://layla:8080}"
      # Unlike the two above, Immich is in the *other* compose stack, so there is
      # no service name this file can assume. Left empty on purpose — see
      # .env.example for the two usual answers.
      AGENT_IMMICH_URL: "${AGENT_IMMICH_URL:-}"
      AGENT_IMMICH_API_KEY: "${AGENT_IMMICH_API_KEY:-}"
      AGENT_VISION_MODEL: "${AGENT_VISION_MODEL:-moondream}"
      AGENT_DECISION_BATCH: "${AGENT_DECISION_BATCH:-8}"
    volumes:
      # Container health and restarts
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: the agent reports on the libraries, it never writes to them
      - /srv/photos:/srv/photos:ro
      - /srv/cloud:/srv/cloud:ro
      # The backup timer's verdict file. Without this mount the agent cannot see
      # it and falls back to inferring success from snapshot age — see README.md.
      - /var/lib/filesynapse:/var/lib/filesynapse:ro
      # A narrower, writable mount on top of that read-only one. Nested mounts
      # are applied deepest-first, so the agent can cache captions here while
      # still being unable to write the backup verdict it reports on.
      - /var/lib/filesynapse/decisions:/var/lib/filesynapse/decisions

  # The vision model. Started only with `--profile decisions`, because pulling a
  # multi-gigabyte model as a side effect of deploying a status agent would be a
  # nasty surprise on a machine that has to survive Immich indexing first.
  #
  #   docker compose --profile decisions up -d
  #   docker compose exec ollama ollama pull moondream
  #
  # Nothing in the app talks to this port; only the agent does, over the compose
  # network. It is published so a human can pull models and poke at it.
  ollama:
    image: ollama/ollama:latest
    profiles: ["decisions"]
    restart: unless-stopped
    # The one place a cap genuinely matters. On an 8 GB box that is also running
    # Immich's own ML container, an uncapped Ollama loading a 1.8B model is how
    # the machine ends up in swap and takes Immich down with it. Raise it in .env
    # if you have the headroom; the failure mode of too low is a refused load,
    # which is visible, rather than a swap stall, which is not.
    mem_limit: ${OLLAMA_MEMORY:-3g}
    # `ollama list` is used rather than an HTTP probe: the image is the one thing
    # guaranteed to contain the ollama binary, and it needs no extra tooling.
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "11434:11434"
    environment:
      # Unload the model once nothing is asking. This box also runs Immich's own
      # ML container, and a resident 1.8B model is roughly 2 GB it cannot spare.
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
    volumes:
      - ollama-models:/root/.ollama

  # The decision model — the open-weight alternative to TypeSafe's Jev, and the
  # thing this pipeline was built for.
  #
  # UNVERIFIED: never built or run. The Dockerfile installs `laya` from PyPI and
  # serves its own `predict` almost unchanged, so there is very little here to be
  # wrong — but "very little" is not "checked". See for-human.md §8.
  #
  # It publishes no port. Only the agent talks to it, over the compose network,
  # which is strictly better than exposing a service that accepts arbitrary state.
  #
  # The image is large: torch, plus the checkpoint on first use. That is why it
  # sits behind the profile with Ollama rather than in a normal install.
  layla:
    build: ./layla
    profiles: ["decisions"]
    restart: unless-stopped
    mem_limit: ${LAYLA_MEMORY:-4g}
    environment:
      # The multilingual checkpoint, not the English one. Laya's English
      # checkpoint stays confident while collapsing outside English, and photo
      # captions are not reliably English — the vision model is asked to describe
      # a picture, not to write prose in a language we chose.
      LAYLA_CHECKPOINT: "${LAYLA_CHECKPOINT:-convaiinnovations/laya-multilingual}"
    volumes:
      # So a rebuild does not re-download the checkpoints.
      - layla-models:/models
    healthcheck:
      # /health only reports ok once the model is resident, which is the question
      # worth asking — a service that accepts decisions it cannot serve is worse
      # than one still loading.
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  ollama-models:
  layla-models:
